        join:
          joinCondition: FROM {{ ref('DBSHIFT', 'DW_POLICY_LINE_STAGING') }} "pls"
            INNER JOIN {{ ref('DBSHIFT', 'DW_SOURCE_SYSTEM') }} "s" ON pls.source_system
            = s.source_system AND s.agency_company = 'Alliant' LEFT OUTER JOIN {{
            ref('DBSHIFT', 'DW_POLICY_LINE_STATUS_GROUP') }} "plsg" ON pls.LineStatusCode
            = plsg.line_status_code WHERE pls.LineStatusCode IS NOT NULL AND plsg.line_status_code
            IS NULL GROUP BY s.dw_source_system_id, pls.linestatuscode
