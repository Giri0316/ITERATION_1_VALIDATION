            INNER JOIN {{ ref('DBSHIFT', 'DW_CLIENT_CURRENT') }} "cc" ON "cbc"."DW_CLIENT_ID" = "cc"."DW_CLIENT_ID"
            INNER JOIN {{ ref('DBSHIFT', 'DW_STRUCTURE_CURRENT') }} "sc" ON "cbc"."DW_STRUCTURE_ID" = "sc"."DW_STRUCTURE_ID"
            LEFT OUTER JOIN {{ ref('DBSHIFT', 'EMPLOYEE_SERVICING_ROLE') }} "esr" ON "cbc"."DW_CLIENT_ID" = "esr"."DW_CLIENT_ID" AND "esr"."EMPLOYEE_SERVICING_ROLE_TYPE" = 'Client'
            CROSS JOIN {{ ref('DBSHIFT', 'DW_SOURCE_SYSTEM') }} "dss"
            WHERE CURRENT_DATE() BETWEEN "cbc"."POLICY_EFFECTIVE_DATE" AND IFNULL("cbc"."POLICY_EXPIRATION_DATE", '2099-12-31')
